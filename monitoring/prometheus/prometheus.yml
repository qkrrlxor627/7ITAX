global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 알림 규칙 파일 (골든 시그널)
rule_files:
  - 'alert.rules.yml'

# 규칙 위반 시 알림을 보낼 Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Spring Boot 백엔드 — compose backend 컨테이너를 같은 네트워크의 서비스명으로 스크랩
  - job_name: 'tax7i-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']          # compose backend 컨테이너
      # - targets: ['host.docker.internal:8080']  # 호스트에서 bootRun으로 띄울 때
        labels:
          application: 'tax7i'

  # Prometheus 자기 자신
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
