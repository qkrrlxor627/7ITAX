spring:
  application:
    name: tax7i
  config:
    import: optional:classpath:application-local.yaml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tax7i}
    username: ${DB_USERNAME:ssafy}
    password: ${DB_PASSWORD:ssafy}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
    open-in-view: false

encryption:
  aes-key: ${AES_ENCRYPTION_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 604800000

app:
  test-login:
    enabled: false

# SSAFY 교육 과정 종료로 서버 접근 불가 — 키 미설정 시 빈 값으로 기동된다.
ssafy:
  oauth:
    authorization-uri: https://project.ssafy.com/oauth/sso-check
    token-uri: https://project.ssafy.com/ssafy/oauth2/token
    user-info-uri: https://project.ssafy.com/ssafy/resources/userInfo
    client-id: ${SSAFY_CLIENT_ID:}
    client-secret: ${SSAFY_CLIENT_SECRET:}
    redirect-uri: ${SSAFY_REDIRECT_URI:}

tax:
  office-code: "0305"

ai:
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  connect-timeout: 3
  read-timeout: 10

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

fcm:
  enabled: ${FCM_ENABLED:false}
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}

solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  sender-phone: ${SOLAPI_SENDER_PHONE:}

# Actuator: 모니터링(Prometheus/Grafana)용 엔드포인트 노출
# 운영 환경에서는 별도 management.server.port 분리 + 인증 적용 권장
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
