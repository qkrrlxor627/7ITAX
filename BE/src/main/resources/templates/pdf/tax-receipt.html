<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }
        body {
            font-family: 'NanumGothic', sans-serif;
            font-size: 10pt;
            line-height: 1.4;
            color: #000;
        }
        h1 {
            text-align: center;
            font-size: 18pt;
            margin-bottom: 4px;
        }
        h3 {
            font-size: 12pt;
            margin-top: 20px;
            margin-bottom: 8px;
            border-bottom: 1px solid #000;
            padding-bottom: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px 10px;
        }
        th {
            background-color: #e8e8e8;
            text-align: center;
            font-weight: bold;
        }
        td.label {
            background-color: #f5f5f5;
            width: 35%;
            font-weight: bold;
        }
        td.value {
            text-align: right;
        }
        .center {
            text-align: center;
        }
        .right {
            text-align: right;
        }
        .sub-header {
            text-align: center;
            font-size: 9pt;
            color: #555;
            margin-bottom: 20px;
        }
        .disclaimer {
            margin-top: 30px;
            padding: 10px;
            border: 1px solid #999;
            font-size: 8pt;
            color: #555;
            text-align: center;
        }
        .footer {
            margin-top: 40px;
            font-size: 9pt;
            text-align: center;
            color: #333;
        }
        .total-row td {
            font-weight: bold;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

<h1>납부확인서</h1>
<p class="sub-header">7iTAX Simulation</p>

<h3>납세자 정보</h3>
<table>
    <tr>
        <td class="label">성명</td>
        <td th:text="${r.taxpayerName}">-</td>
    </tr>
    <tr>
        <td class="label">주민등록번호</td>
        <td th:text="${r.residentNumber}">-</td>
    </tr>
    <tr>
        <td class="label">귀속연도</td>
        <td th:text="${r.taxYear} + '년'">-</td>
    </tr>
    <tr>
        <td class="label">접수번호</td>
        <td th:text="${r.receiptNumber != null ? r.receiptNumber : '-'}">-</td>
    </tr>
</table>

<h3>납부 내역</h3>
<table>
    <thead>
        <tr>
            <th style="width: 20%;">구분</th>
            <th style="width: 25%;">납부금액</th>
            <th style="width: 20%;">납부상태</th>
            <th style="width: 35%;">납부일시</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="p : ${payments}">
            <td class="center" th:text="${p.paymentType.name() == 'NATIONAL' ? '국세' : '지방세'}">-</td>
            <td class="right" th:text="${#numbers.formatInteger(p.amount, 0, 'COMMA')} + ' 원'">0</td>
            <td class="center" th:text="${p.status}">-</td>
            <td class="center" th:text="${p.paidAt != null ? #temporals.format(p.paidAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
        </tr>
        <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="4" class="center">납부 내역이 없습니다.</td>
        </tr>
    </tbody>
</table>

<h3>세액 요약</h3>
<table>
    <tr>
        <td class="label">납부할 국세</td>
        <td class="value" th:text="${#numbers.formatInteger(r.finalTax, 0, 'COMMA')} + ' 원'">0</td>
    </tr>
    <tr>
        <td class="label">지방소득세</td>
        <td class="value" th:text="${#numbers.formatInteger(r.localTax, 0, 'COMMA')} + ' 원'">0</td>
    </tr>
    <tr class="total-row">
        <td class="label">총 납부세액</td>
        <td class="value" th:text="${#numbers.formatInteger(r.finalTax + r.localTax, 0, 'COMMA')} + ' 원'">0</td>
    </tr>
</table>

<div class="disclaimer">
    본 문서는 7iTAX 시뮬레이션 환경에서 생성되었으며, 실제 납세증빙으로 사용할 수 없습니다.
</div>

<div class="footer">
    <p>본 확인서는 전자문서로 발급되었으며, 7iTAX 시스템에서 보관됩니다.</p>
    <p>발급기관: 7iTAX (SSAFY 시뮬레이션)</p>
</div>

</body>
</html>
