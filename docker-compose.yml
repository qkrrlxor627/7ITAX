services:
  postgres:
    image: postgres:16
    container_name: tax7i-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tax7i
      POSTGRES_USER: ssafy
      POSTGRES_PASSWORD: ssafy
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssafy -d tax7i"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7
    container_name: tax7i-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ssafy
    volumes:
      - redis-data:/var/lib/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ssafy", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: tax7i-ai
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL_OPUS: ${CLAUDE_MODEL_OPUS:-claude-opus-4-8}
      CLAUDE_MODEL_HAIKU: ${CLAUDE_MODEL_HAIKU:-claude-haiku-4-5-20251001}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      DEBUG: ${AI_DEBUG:-false}
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      BACKEND_BASE_URL: http://host.docker.internal:8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')\""]
      interval: 15s
      timeout: 10s
      retries: 3
      # 최초 기동 시 ChromaDB 자동 인덱싱(세법 PDF 임베딩)이 수 분 걸릴 수 있어 넉넉히 설정.
      # lifespan 완료 전에는 포트가 열리지 않아 health가 실패하므로 이 구간을 무시한다.
      start_period: 600s
    volumes:
      - ai-chroma-data:/app/data/chroma

  worker:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: tax7i-worker
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tax7i
      DB_USERNAME: ssafy
      DB_PASSWORD: ssafy
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ssafy}
      AI_SERVICE_BASE_URL: http://ai:8000
      # AES_ENCRYPTION_KEY(Base64 32바이트)·JWT_SECRET(32바이트 이상)은 시크릿이라 기본값 없이 필수.
      # `docker compose up` 실행 시 환경변수로 전달해야 하며 백엔드(bootRun)와 동일 값을 쓴다.
      # (과거 JWT_SECRET 기본값 'default-secret'은 14바이트 → jjwt HS256 최소 길이 미달로 worker 크래시 루프였음)
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: tax7i-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    extra_hosts:
      # 컨테이너에서 호스트(로컬 8080 백엔드)로 접근 가능하게 (Linux 호환)
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: tax7i-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

  # 로컬 알림 테스트 수신기 — 받은 웹훅 요청을 stdout에 그대로 출력
  # (운영 시에는 alertmanager.yml의 webhook url을 실제 Slack/Discord로 교체)
  webhook-logger:
    image: mendhak/http-https-echo:31
    container_name: tax7i-webhook-logger
    environment:
      HTTP_PORT: 8080
    ports:
      - "8025:8080"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: tax7i-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ai-chroma-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
